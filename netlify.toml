# The OutBrick website is published here as a finished static build, not built by Netlify.
#
# The site's source is a Next/vinext app that lives in the OutBrick app repository under
# `website/`; `pnpm build` there prerenders every page into `website/dist/client`, and that
# directory is what `site/` holds. Netlify has nothing to compile, so there is no build
# command — an empty one is deliberate, not an omission. Re-publishing is: rebuild in the app
# repository, copy `website/dist/client` over `site/`, commit.
#
# `site/_headers` carries the two content types that must not be guessed: the Apple app-site
# association file (JSON, and extensionless, so the host cannot infer it) and app-ads.txt
# (plain text — a host that answers text/html is the usual reason AdMob verification fails).
[build]
  publish = "site"
  command = ""

# Pages are prerendered as `<name>.html` at the root and served at `/<name>`; Netlify's
# Pretty URLs do that mapping, so no redirect rules are needed for them.

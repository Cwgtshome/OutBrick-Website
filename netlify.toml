# Netlify builds this site from source. That is the whole point of this file.
#
# It used to publish a prerendered copy instead, because the machine that assembled it had no
# Node and could not run the build. That worked and was wrong: the copy was a month old, and
# the privacy policy it served still said OutBrick contained no advertising SDK — which had
# stopped being true when 3.0 added rewarded video. A build output committed by hand goes
# stale silently, and the page that goes stale is never the one you would have checked.
#
# `vinext build` prerenders every route into dist/client. There is no server component to
# deploy: dist/server exists in the build but nothing here serves it, and every page in this
# site is static.
[build]
  command = "pnpm build"
  publish = "dist/client"

[build.environment]
  # package.json asks for >=22.13.0; pin both so a Netlify default change cannot move them.
  NODE_VERSION = "22.13.0"
  PNPM_VERSION = "10.12.1"

# Content types that must not be guessed are set in `public/_headers`, which the build copies
# to the root of dist/client: the Apple app-site-association file (JSON, and extensionless,
# so a host cannot infer it) and app-ads.txt (plain text — a host answering text/html is the
# usual reason AdMob verification fails without saying so).

# Alias routes. `app/privacy-policy`, `app/license`, `app/refund`, `app/eula-apple`,
# `app/accessibility-support` and `app/age-suitability` re-export another page, so each is a
# second copy of the same content at a second address. They exist because those names were
# given out (App Store Connect fields, older links), so they have to keep answering — but with
# a permanent redirect to the one address the footer and the sitemap use.
#
# `force = true` because each alias is still prerendered to a real file, and Netlify serves an
# existing file ahead of a non-forced rule. The `.html` forms are listed too: Netlify serves
# `/privacy-policy.html` directly otherwise. Trailing slashes (`/privacy-policy/`), the apex
# domain and plain http are already normalised by Netlify before these rules run.
#
# scripts/postbuild.mjs reads these blocks and leaves every 3xx `from` path out of the sitemap,
# so a new alias only has to be added here.
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/license"
  to = "/license-agreement"
  status = 301
  force = true

[[redirects]]
  from = "/license.html"
  to = "/license-agreement"
  status = 301
  force = true

[[redirects]]
  from = "/refund"
  to = "/refunds"
  status = 301
  force = true

[[redirects]]
  from = "/refund.html"
  to = "/refunds"
  status = 301
  force = true

[[redirects]]
  from = "/eula-apple"
  to = "/eula"
  status = 301
  force = true

[[redirects]]
  from = "/eula-apple.html"
  to = "/eula"
  status = 301
  force = true

[[redirects]]
  from = "/accessibility-support"
  to = "/accessibility"
  status = 301
  force = true

[[redirects]]
  from = "/accessibility-support.html"
  to = "/accessibility"
  status = 301
  force = true

[[redirects]]
  from = "/age-suitability"
  to = "/age-rating"
  status = 301
  force = true

[[redirects]]
  from = "/age-suitability.html"
  to = "/age-rating"
  status = 301
  force = true

# The path form of a challenge link.
#
# `BrickoutMessages/Challenge.swift` parses both `/c?lv=<n>` and `/c/<n>`, and
# `/.well-known/apple-app-site-association` claims both against the app, so on a device
# with OutBrick installed iOS opens the board and no page is drawn at all. On a device
# without it, only `/c` is a real prerendered file — `/c/42` was a 404, which is exactly
# the dead end the https form exists to remove.
#
# A 200 rewrite rather than a redirect: the address bar stays on `/c/42`, so the page can
# still read the level out of `location.pathname`. Generating a page per level is the
# other way and it is the wrong one — the road keeps generating addresses past 2,000,
# so there is no finite set to prerender.
[[redirects]]
  from = "/c/*"
  to = "/c"
  status = 200

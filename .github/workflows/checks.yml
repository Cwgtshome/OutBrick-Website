# Runs on every pull request and push to main, so a change cannot quietly undo the site's
# baseline: it must build, lint, keep every page's SEO metadata valid, keep the playable boards
# solvable at their stated targets, and pass axe (WCAG 2.1 AA) at desktop and phone widths.
name: Site checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # postbuild.mjs dates sitemap entries from git history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: it writes lib/generated/app-store.json, which the type-aware lint reads.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Newsletter confirmation and unsubscribe
        run: node --experimental-strip-types --test scripts/test-newsletter.mjs

      - name: Cloudflare translation free allowance and request isolation
        run: node --experimental-sqlite --experimental-strip-types --test scripts/cloudflare/translation-budget.test.mjs netlify/platform.test.ts

      - name: Player guide links and additive seed
        run: node --experimental-strip-types --test netlify/community/player-guides.test.ts netlify/community/threads.test.ts

      - name: Administrative roles and editorial publishing
        run: node --experimental-strip-types --test netlify/community/admin.test.ts netlify/community/moderation.test.ts
      - name: SEO audit
        run: pnpm audit:seo

      - name: Playable boards are solvable at their targets
        run: node --experimental-strip-types scripts/verify-board-levels.mjs

      - name: Help Centre guides match English in every language
        run: pnpm check:help
      - name: Translation and route coverage
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/audit-localization.mjs

      - name: Localized asset coverage
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/audit-localized-assets.mjs

      - name: Internal links
        run: pnpm check:links

      - name: Save exact built site for independent browser checks
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: dist/client
          include-hidden-files: true
          retention-days: 7

  accessibility:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/download-artifact@v4
        with:
          name: built-site
          path: dist/client
      - name: Install audit tools outside the project
        run: |
          mkdir -p "$RUNNER_TEMP/audit-tools"
          cd "$RUNNER_TEMP/audit-tools"
          npm init -y >/dev/null
          npm i playwright@1.56.1 axe-core@4
          npx playwright install --with-deps chromium
      - name: Every page at both widths, partitioned across four jobs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/audit-tools/node_modules/playwright/index.mjs
          AXE_PATH: ${{ runner.temp }}/audit-tools/node_modules/axe-core/axe.min.js
          AUDIT_SHARD_INDEX: ${{ matrix.shard }}
          AUDIT_SHARD_COUNT: 4
        run: |
          node scripts/serve-dist.mjs 4321 &
          sleep 1
          if [ "$AUDIT_SHARD_INDEX" = "0" ]; then
            node scripts/verify-form-locales.mjs http://127.0.0.1:4321
            node scripts/verify-journal-locales.mjs http://127.0.0.1:4321
            node scripts/verify-locale-navigation.mjs http://127.0.0.1:4321
          fi
          node scripts/audit-a11y.mjs http://127.0.0.1:4321

  cross-browser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/download-artifact@v4
        with:
          name: built-site
          path: dist/client
      - name: Install audit tools outside the project
        run: |
          mkdir -p "$RUNNER_TEMP/audit-tools"
          cd "$RUNNER_TEMP/audit-tools"
          npm init -y >/dev/null
          npm i playwright@1.56.1
          npx playwright install --with-deps webkit firefox
      - name: WebKit desktop, iPhone, Firefox desktop and phone in separate jobs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/audit-tools/node_modules/playwright/index.mjs
          SMOKE_TARGET_INDEX: ${{ matrix.target }}
        run: |
          node scripts/serve-dist.mjs 4322 &
          sleep 1
          node scripts/smoke-browsers.mjs http://127.0.0.1:4322

  responsive:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/download-artifact@v4
        with:
          name: built-site
          path: dist/client
      - name: Install browser tools outside the project
        run: |
          mkdir -p "$RUNNER_TEMP/audit-tools"
          cd "$RUNNER_TEMP/audit-tools"
          npm init -y >/dev/null
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Every public page at five widths
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/audit-tools/node_modules/playwright/index.mjs
          RESPONSIVE_SHARD_INDEX: ${{ matrix.shard }}
          RESPONSIVE_SHARD_COUNT: 4
        run: |
          node scripts/serve-dist.mjs 4323 &
          sleep 1
          node scripts/check-responsive.mjs http://127.0.0.1:4323

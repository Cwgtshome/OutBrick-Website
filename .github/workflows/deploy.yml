# Enable DEPLOY_TO_CLOUDFLARE only after migration cutover and live acceptance.
name: Deploy to production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.DEPLOY_TO_CLOUDFLARE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: e33a32f168de9597cfccf1698cb153a8
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GA_MEASUREMENT_ID: G-13BKCF9FV4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm audit:seo
      - run: pnpm check:links
      - run: pnpm check:jsonld
      - run: pnpm cloudflare:prepare
      - name: Deploy shared free translation limiter
        run: pnpm exec wrangler deploy --config wrangler.translation.jsonc
      - name: Deploy website
        run: node scripts/cloudflare/deploy-version.mjs
      - name: Verify production routes and exact build
        run: |
          node scripts/cloudflare/smoke.mjs https://www.outbrick.site
          node --input-type=module -e 'const r=await fetch("https://www.outbrick.site/build-info.json?cb="+Date.now());const b=await r.json();if(b.commit!==process.env.GITHUB_SHA)throw Error("Production build mismatch")'
      - name: Submit public sitemaps
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/cloudflare/deploy-succeeded.mjs

# Production deploy from GitHub (8 October 2026).
#
# Netlify's own Git builds count against the team's build credits, which ran out on 8 October
# 2026 after a run of failed builds. This workflow does the same work on GitHub's runner instead:
# `netlify deploy --build --prod` runs the full Netlify pipeline here — the site build
# (`pnpm build`), Netlify Database migrations, Functions and Edge Functions bundling, headers and
# redirects from netlify.toml — and uploads the result to the `outbrick` project. Netlify then
# only serves it.
#
# Setup (once, by the owner):
#   1. Netlify → User settings → Applications → Personal access tokens → New token.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions:
#        secret   NETLIFY_AUTH_TOKEN = that token
#        variable DEPLOY_FROM_GITHUB = true      (anything else, or unset, disables this workflow)
#   Build-time environment (GA_MEASUREMENT_ID, RESEND_API_KEY, …) is read from the Netlify
#   project by the CLI, so nothing else needs copying.
#
# A Netlify production deploy may itself still need credits; if Netlify refuses the publish, the
# job fails with Netlify's message and the live site stays as it was. When Netlify's own Git
# builds are healthy again, set DEPLOY_FROM_GITHUB to false (or stop Netlify's builds) so a
# commit is not deployed twice.

name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_FROM_GITHUB == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_SITE_ID: 8b73b763-21f4-405b-a284-a4605cc31d2f
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # postbuild.mjs dates sitemap entries and names the build from git history.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the deploy token is configured
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not set; see the header of this workflow."
            exit 1
          fi

      - name: Build and deploy with the Netlify pipeline
        run: >
          npx --yes netlify-cli@27.8.1 deploy --build --prod --context production
          --site "$NETLIFY_SITE_ID"
          --message "GitHub Actions ${{ github.sha }}"

      - name: Confirm the live build
        run: |
          for i in $(seq 1 18); do
            live=$(curl -fsS "https://www.outbrick.site/build-info.json?cb=$RANDOM" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).commit))' || true)
            if [ "$live" = "${{ github.sha }}" ]; then echo "Live: $live"; exit 0; fi
            sleep 10
          done
          echo "::warning::The deploy finished but build-info.json reports '$live' rather than ${{ github.sha }} (a CDN cache, or a newer deploy)."
